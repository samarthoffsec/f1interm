[package]
name = "f1interm"
version = "0.1.0"
edition = "2021"

[dependencies]
color-eyre = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3.17", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tokio-util = "0.7"
futures = "0.3"
async-trait = "0.1"
rand = "0.8"